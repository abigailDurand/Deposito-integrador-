name: Recibir actualizacion

on:
  repository_dispatch:
    types: [servicio-actualizado]

permissions:
  contents: write

concurrency:
  group: recibir-actualizacion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest

    env:
      SERVICIO: ${{ github.event.client_payload.servicio }}
      IMAGEN: ${{ github.event.client_payload.imagen }}
      TAG: ${{ github.event.client_payload.tag }}
      COMMIT: ${{ github.event.client_payload.commit }}

    steps:
      - name: Mostrar evento
        run: |
          echo "Servicio: $SERVICIO"
          echo "Imagen:   $IMAGEN:$TAG"
          echo "Commit:   $COMMIT"

      - name: Validar payload
        run: |
          if [ -z "$SERVICIO" ] || [ -z "$IMAGEN" ] || [ -z "$TAG" ]; then
            echo "::error::Faltan campos en client_payload (servicio, imagen, tag)"
            exit 1
          fi
          if ! echo "$SERVICIO" | grep -Eq '^[a-z0-9-]+$'; then
            echo "::error::Nombre de servicio invalido: $SERVICIO"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Actualizar version fijada
        run: |
          mkdir -p "services-config/$SERVICIO"
          cat > "services-config/$SERVICIO/version.env" <<EOF
          IMAGEN=$IMAGEN
          TAG=$TAG
          COMMIT=$COMMIT
          EOF
          cat "services-config/$SERVICIO/version.env"

      - name: Commit de la nueva version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "services-config/$SERVICIO/version.env"
          if git diff --cached --quiet; then
            echo "Sin cambios: la version ya estaba fijada."
            exit 0
          fi
          git commit -m "chore($SERVICIO): fijar $IMAGEN:$TAG"
          git push

      # ...aquí: desplegar a la nube (requiere credenciales propias del integrador)
