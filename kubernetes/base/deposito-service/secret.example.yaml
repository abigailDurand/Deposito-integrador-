# PLANTILLA: no se aplica con kustomize ni lleva valores reales.
# Crea el Secret directamente en el clúster, por ejemplo:
#
#   kubectl -n <namespace> create secret generic deposito-service-secrets \
#     --from-literal=DATABASE_URL='postgres://usuario:clave@host:5432/deposito' \
#     --from-literal=JWT_PUBLIC_KEY="$(cat usuario-service.pub.pem)" \
#     --from-literal=BILLETERA_TOKEN='token-acordado-con-billetera'
#
# Opcionales (OAuth hacia Billetera USD): BILLETERA_USD_TOKEN_URL, BILLETERA_USD_CLIENT_ID,
# BILLETERA_USD_CLIENT_SECRET. Umbrales UIF: UIF_UMBRAL_PEN, UIF_UMBRAL_USD.
apiVersion: v1
kind: Secret
metadata:
  name: deposito-service-secrets
type: Opaque
stringData:
  DATABASE_URL: postgres://usuario:clave@host:5432/deposito
  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    ...
    -----END PUBLIC KEY-----
  BILLETERA_TOKEN: cambiar-por-el-token-acordado
