apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banco-desarrollo

resources:
  - namespace.yaml
  - ../../base

patches:
  - target:
      kind: Deployment
      name: deposito-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: ConfigMap
      name: deposito-service-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: debug
